Name=Sea Power Tactical UI
Description=Takes routine micromanagement off your hands: ASW barrier and strike, air-defence patrol and stand-by, torpedo evasion, radar layer with jamming, range rings, intercept course, Overview of contacts and own units, task line, radial menu, settings. No network, no microphone. Needs BepInEx 5.4.x and AnchorChain. GPL-3.0, source included.

