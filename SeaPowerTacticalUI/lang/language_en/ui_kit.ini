; T-148: tooltips of the shared window frame and sections (UiWindowFrame / UiKit).
[SeaPowerTacticalUI]
ui.kit.collapse=Collapse the section
ui.kit.expand=Expand the section
ui.kit.close=Close the window
ui.kit.minimize=Collapse the window to one line
ui.kit.restore=Expand the window
ui.kit.resize=Drag the right edge to change the width
ui.kit.empty=No data
