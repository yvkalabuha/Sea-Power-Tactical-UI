; ---------------------------------------------------------------- T-138: intercept course
settings.intercept.enabled=Intercept course
settings.intercept.enabled.hint=The "Intercept course" item in the contact context menu: intercept point and time from the track. Takes effect after a game restart.
settings.intercept.mode=Route follows the target
settings.intercept.mode.hint=Track: the route is replanned while the target moves. Once: one plan, no replanning.
settings.intercept.mode.opt.track=Follow the target
settings.intercept.mode.opt.once=One plan
settings.intercept.speed=Speed of the intercept
settings.intercept.speed.hint=Auto: the smallest telegraph step that catches the target. Current: keep the telegraph as it is.
settings.intercept.speed.opt.auto=Auto
settings.intercept.speed.opt.current=Keep current
settings.intercept.showline=Intercept line on the map
settings.intercept.showline.hint=Draw the line to the intercept point and the point itself on the tactical map.
settings.intercept.avoidenemyranges=Enemy weapon zones
settings.intercept.avoidenemyranges.hint=The route is checked against the weapon ranges of identified hostile ships (class data, as the range rings; unidentified ones are not seen). Warn: only a ⚠ in the menu and on the line. Detour: the route goes around the circles when a way exists, else a warning. Off: no check.
settings.intercept.avoidenemyranges.opt.warn=Warn
settings.intercept.avoidenemyranges.opt.detour=Detour
settings.intercept.avoidenemyranges.opt.off=Off
settings.intercept.onzoneentry=Before entering a zone
settings.intercept.onzoneentry.hint=What to do when the entry into an enemy weapon zone (not the target's) is ZoneLeadS seconds away. Stop and wait: all stop, the intercept goes on when the zone leaves the route. Stop and cancel: all stop, the intercept ends.
settings.intercept.onzoneentry.opt.warn=Warn only
settings.intercept.onzoneentry.opt.hold=Stop and wait
settings.intercept.onzoneentry.opt.abort=Stop and cancel

; ---------------------------------------------------------------- T-137: range rings
settings.rangerings.enabled=Range rings
settings.rangerings.enabled.hint=Range rings of the checked weapons and sonar zones on the tactical map. Takes effect after a game restart.
settings.rangerings.show=Show range rings
settings.rangerings.show.hint=The map layer entry "Range rings"; the same as the hotkey. Shows or hides every ring. Weapons are checked in "XO > Rings > Weapon" and in the foreign-contact menu "Weapon >".
settings.rangerings.hotkey=Toggle range rings
settings.rangerings.hotkey.hint=Key that turns the range rings on or off.
settings.rangerings.own=Own rings
settings.rangerings.own.hint=Rings of own and allied units. Auto: off when the Better TacMap mod is installed (it draws them). On: always draw, Off: never.
settings.rangerings.own.opt.auto=Auto (off with Better TacMap)
settings.rangerings.own.opt.on=On
settings.rangerings.own.opt.off=Off
settings.rangerings.own.btm=Own rings are drawn by Better TacMap (RangeRings.Own=on to draw ours too)
settings.rangerings.own.note_off=Own rings are off (RangeRings.Own=off)
settings.rangerings.own.enemy_only=Enemy rings only: own rings are off (RangeRings.Own)
settings.rangerings.scope=Whose rings
settings.rangerings.scope.hint=Whose sonar rings: the selected own unit or its whole group (formation).
settings.rangerings.scope.opt.selected=Selected unit
settings.rangerings.scope.opt.group=Whole group
settings.rangerings.show.sonar=Sonar rings
settings.rangerings.show.sonar.hint=Active and passive sonar range of the selected own units and the passive sonar of the selected or pinned foreign contact. Off by default.
settings.rangerings.showallies=Allied units
settings.rangerings.showallies.hint=Also draw the sonar rings of allied units of the selected group.
settings.rangerings.labels=Ring labels
settings.rangerings.labels.hint=The weapon and its range next to a ring: "Harpoon 67 nm", "Harpoon up to 67 nm" for a foreign class.
settings.rangerings.legend=Ring legend
settings.rangerings.legend.hint=The colours of the rings in the top-right corner of the map, under the time panel, above the radar legend. Off — the map menu item is inactive.

; ---------------------------------------------------------------- T-100: aircraft evasion
settings.airevade.enabled=Aircraft evade attack
settings.airevade.enabled.hint=The Evade attack item in the aircraft ring and the Auto missile evasion flag. Takes effect after a game restart.
settings.airevade.autottis=Auto evasion: seconds before impact
settings.airevade.autottis.hint=Flag Auto missile evasion: the aircraft turns away from a missile when no more than this time is left before impact.
settings.airevade.optionhint=Hint when the game option is off
settings.airevade.optionhint.hint=Say once per mission that the game option for aircraft missile evasion is off.
settings.perf.lightsmoke=Light smoke of missiles and explosions
settings.perf.lightsmoke.hint=Fewer particles in new missile trails, explosions, fires and splashes. Less GPU load in combat; FPS did not grow in the measurements. Off by default.
settings.messages.hostilered=Hostile contacts in red
settings.messages.hostilered.hint=The message window and the top alerts show a hostile classification ("Bandit!", "classified as hostile") in red instead of the default colour. Neutral and friendly messages keep their colour. Applies at once.
settings.messages.quietmodwaypoints=Do not repeat "We're on position" for the mod's aircraft
settings.messages.quietmodwaypoints.hint=Aircraft and helicopters of the CAP, ASW and SAR groups that the mod controls reported "We're on position, out" (text and voice) after every route. Now at most one message per aircraft per QuietRepeatS seconds (300 s of mission time by default). Aircraft you order yourself are not touched. Off = as in the game. Applies at once.
settings.section.hit_estimate=Hit estimate
settings.hitestimate.enabled=Hits-to-kill estimate
settings.hitestimate.enabled.hint=The + on the row of an identified foreign contact in the Overview opens the estimate for your weapons, the list of your hits and the total. It is approximate: without SAM, CIWS, ECM and decoys.
settings.hitestimate.counter=Hit counter
settings.hitestimate.counter.hint=Count your hits from the game's weapon report: the list in the expanded row and the Hits and Dmg columns. Gun shells are not counted. Takes effect after the game restarts.
settings.overview.columns.opt.hits=Hits
settings.overview.columns.opt.dmg=Damage
