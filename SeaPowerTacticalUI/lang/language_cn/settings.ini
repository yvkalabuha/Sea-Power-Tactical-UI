; T-144: texts of the settings window (labels, hints, options, sections, units)
[SeaPowerTacticalUI]
settings.asw.areasizenm=搜索区域大小
settings.asw.areasizenm.hint=区域搜索命令的默认区域边长（海里）。
settings.asw.autoradar=搜索时开启机载雷达
settings.asw.autoradar.hint=反潜直升机或飞机搜索时，模组会开启其搜索雷达（探测潜望镜、通气管）。撤退和返航时恢复原状；玩家手动关闭的雷达不受影响。
settings.asw.hotkey=打开反潜窗口
settings.asw.hotkey.hint=打开反潜窗口的按键。
settings.asw.restoreonload=读档后的反潜编组
settings.asw.restoreonload.hint=读取存档后如何处理反潜编组。
settings.asw.restoreonload.opt.auto=自动恢复
settings.asw.restoreonload.opt.ask=询问
settings.asw.restoreonload.opt.off=不恢复
settings.asw.standby=反潜备用机
settings.asw.standby.hint=为接替保留的待命备用飞机数量（0..3）。
settings.attack.allowattack=允许攻击
settings.attack.allowattack.hint=关闭：模组拒绝执行武器命令。
settings.autoevade.antitorpedo=反鱼雷火箭
settings.autoevade.antitorpedo.hint=模组规避会按命中时间顺序向来袭鱼雷发射反鱼雷火箭——包括射向自身和邻舰的鱼雷。
settings.autoevade.antitorpedocover=掩护邻舰
settings.autoevade.antitorpedocover.hint=自身无威胁的舰船向驶向附近己方及盟友舰船的鱼雷开火（不改变航向）。
settings.autoevade.mode=鱼雷规避
settings.autoevade.mode.hint=使用模组的规避或游戏内置规避。
settings.autoevade.mode.opt.own=模组规避
settings.autoevade.mode.opt.native=游戏内置
settings.autoevade.submode=潜艇鱼雷规避
settings.autoevade.submode.hint=由模组包装的游戏规避，或模组自己的规避。
settings.autoevade.submode.opt.native=游戏规避
settings.autoevade.submode.opt.own=模组规避
settings.autoevade.subdeepdive=潜艇深潜
settings.autoevade.subdeepdive.hint=当鱼雷无法到达时，下潜至压溃深度的 80%。
settings.cap.dashonmissilertb=弹尽高速返航
settings.cap.dashonmissilertb.hint=导弹打完后高速返回甲板。
settings.cap.defaultonstation=在位飞机数
settings.cap.defaultonstation.hint=默认保持在巡逻位置的飞机数量。
settings.cap.enabled=防空（CAP）窗口
settings.cap.enabled.hint=区域内的战斗机编组。重启游戏后生效。
settings.cap.hotkey=打开 CAP 窗口
settings.cap.hotkey.hint=打开防空窗口的按键。
settings.cap.missilepct=离场导弹比例
settings.cap.missilepct.hint=当飞机导弹降至初始数量的此比例时离场。
settings.cap.needlongrange=需要远程导弹
settings.cap.needlongrange.hint=中程和远程导弹耗尽时离场。
settings.cap.patrolaltft=巡逻高度
settings.cap.patrolaltft.hint=单位为英尺。0 表示游戏默认值。
settings.cap.restoreonload=读档后的 CAP 编组
settings.cap.restoreonload.hint=读取存档后如何处理 CAP 编组。
settings.cap.restoreonload.opt.auto=自动恢复
settings.cap.restoreonload.opt.ask=询问
settings.cap.restoreonload.opt.off=不恢复
settings.cap.roe=武器状态
settings.cap.roe.hint=巡逻编组的交战规则。
settings.cap.roe.opt.tight=确认开火
settings.cap.roe.opt.free=自由开火
settings.cap.roe.opt.hold=限制开火
settings.contactinfo.cpatarget=CPA 参照
settings.contactinfo.cpatarget.hint=相对所选己方单位或编组中最近单位的 CPA。
settings.contactinfo.cpatarget.opt.selected=所选单位
settings.contactinfo.cpatarget.opt.group=编组最佳
settings.contactinfo.enabled=接触信息
settings.contactinfo.enabled.hint=地图标签：深度、航速、剩余时间等。
settings.contactinfo.hotkey=切换标签
settings.contactinfo.hotkey.hint=开关全部接触标签的按键。
settings.contactinfo.ownspeednoise=己方航速与噪声
settings.contactinfo.ownspeednoise.hint=在己方舰船和潜艇图标左侧一行显示航速和噪声（dB）；接近空泡时为琥珀色，产生空泡时为红色。
settings.contactinfo.show.age=标签：时效
settings.contactinfo.show.age.hint=显示接触数据的时效。
settings.contactinfo.show.cpa=标签：CPA
settings.contactinfo.show.cpa.hint=显示最近接近点。
settings.contactinfo.show.depth=标签：深度
settings.contactinfo.show.depth.hint=显示深度和温跃层。
settings.contactinfo.show.noise=标签：噪声
settings.contactinfo.show.noise.hint=显示噪声等级。
settings.contactinfo.show.speed=标签：航速
settings.contactinfo.show.speed.hint=显示接触航速。
settings.contactinfo.show.ttg=标签：剩余时间
settings.contactinfo.show.ttg.hint=显示到达路径点的时间。
settings.contactinfo.show.waypoint=标签：路径点
settings.contactinfo.show.waypoint.hint=显示路径点数据。
settings.contactinfo.units=标签单位
settings.contactinfo.units.hint=接触标签的单位：距离——海里或公里，航速——节或公里/时，高度——英尺或米。
settings.contactinfo.waypoint=路径点标签
settings.contactinfo.waypoint.hint=路径点处显示的内容。
settings.contactinfo.waypoint.opt.dist=距离
settings.contactinfo.waypoint.opt.eta=到达时间
settings.contactinfo.waypoint.opt.ttg=剩余时间
settings.contactinfo.waypoint.opt.off=关闭
settings.menu.enabled=Bot 子菜单
settings.menu.enabled.hint=在单位右键菜单中显示 Bot 子菜单。
settings.overview.clickselectsingame=点击即在游戏中选中
settings.overview.clickselectsingame.hint=点击会像地图点击一样在游戏中选中该接触。
settings.overview.columns=概览列
settings.overview.columns.hint=可见的列。图标和类型始终显示。
settings.overview.columns.opt.icon=图标
settings.overview.columns.opt.type=类型
settings.overview.columns.opt.dist=距离
settings.overview.columns.opt.brg=方位
settings.overview.columns.opt.spd=航速
settings.overview.columns.opt.alt=高度
settings.overview.columns.opt.crs=航向
settings.overview.columns.opt.id=编号
settings.overview.columns.opt.sensor=传感器
settings.overview.columns.opt.age=时效
settings.overview.columns.opt.vcl=接近速度
settings.overview.columns.opt.idn=敌我识别
settings.overview.enabled=概览窗口
settings.overview.enabled.hint=敌对和未识别接触。重启游戏后生效。
settings.overview.hotkey=打开概览
settings.overview.hotkey.hint=打开概览窗口的按键。
settings.overview.maxrows=概览行数
settings.overview.maxrows.hint=最多显示行数，5 到 200。
settings.overview.scale=概览缩放
settings.overview.scale.hint=窗口大小系数。0 表示按游戏界面缩放自动设置。
settings.overview.showonstart=启动时打开
settings.overview.showonstart.hint=任务加载后立即打开窗口。
settings.overview.showweapons=显示武器
settings.overview.showweapons.hint=同时列出敌方导弹和鱼雷。
settings.radarcoverage.enabled=雷达覆盖
settings.radarcoverage.enabled.hint=地图上的雷达覆盖叠加层。重启游戏后生效。
settings.radarcoverage.fogalpha=覆盖外暗度
settings.radarcoverage.fogalpha.hint=0 到 0.9。数值越高，无覆盖处越暗。
settings.radarcoverage.hotkey=切换雷达覆盖
settings.radarcoverage.hotkey.hint=开关覆盖叠加层的按键。
settings.radarcoverage.includetargeting=火控雷达
settings.radarcoverage.includetargeting.hint=同时绘制火控雷达。
settings.radarcoverage.jamming=考虑干扰（ECM）
settings.radarcoverage.jamming.hint=按已发现并已识别的干扰机的干扰缩小覆盖区。未知干扰只显示方位和“≤”。
settings.radarcoverage.showoffradars=已关闭的雷达
settings.radarcoverage.showoffradars.hint=对已关闭或处于辐射控制下的雷达绘制灰色虚线轮廓。
settings.radarcoverage.legend=雷达图例
settings.radarcoverage.legend.hint=地图右上角、射程圈图例下方的雷达覆盖图例。关闭——地图菜单项不可用。
settings.radarcoverage.showonstart=启动时开启
settings.radarcoverage.showonstart.hint=游戏开始后立即开启叠加层。
settings.radarcoverage.smallmapwindow=小地图上的覆盖区
settings.radarcoverage.smallmapwindow.hint=主地图未最大化时也绘制覆盖区。
settings.radarcoverage.terrainshadows=地形遮蔽
settings.radarcoverage.terrainshadows.hint=按高度计算地形遮蔽（近似）。
settings.radial.enabled=环形菜单
settings.radial.enabled.hint=所选单位处的命令环：按住鼠标左键。
settings.radial.holdms=按住时间
settings.radial.holdms.hint=打开命令环需按住按钮的毫秒数。
settings.radial.hotkey=命令环按键
settings.radial.hotkey.hint=备用方式：按住该键打开命令环。
settings.radial.icons=扇区图标
settings.radial.icons.hint=在命令环扇区上绘制图标。
settings.radial.onmap=地图上的命令环
settings.radial.onmap.hint=在战术地图上也显示命令环。
settings.radial.scale=命令环缩放
settings.radial.scale.hint=大小系数。0 表示按游戏界面缩放自动设置。
settings.sar.enabled=搜救
settings.sar.enabled.hint=直升机编组的搜救命令。重启游戏后生效。
settings.sar.shiponcomplete=完成后舰船
settings.sar.shiponcomplete.hint=没有救生筏时舰船的行动。
settings.sar.shiponcomplete.opt.restore=恢复航向
settings.sar.shiponcomplete.opt.stop=停止
settings.sar.shiptransittelegraph=舰船转场航速
settings.sar.shiptransittelegraph.hint=转场时的舰船航速。
settings.sar.shiptransittelegraph.opt.current=当前
settings.sar.shiptransittelegraph.opt.medium=中
settings.sar.shiptransittelegraph.opt.full=满
settings.sar.standby=搜救备用机
settings.sar.standby.hint=为接替保留的待命备用搜救直升机数量（0..3）。
settings.sar.threatstandoffnm=防空规避距离
settings.sar.threatstandoffnm.hint=距已知防空火力小于此距离（海里）的救生筏不予接近。
settings.smartattack.enabled=智能鱼雷攻击
settings.smartattack.enabled.hint=潜艇的线导鱼雷攻击。重启游戏后生效。
settings.smartattack.restoreonload=读档后的攻击
settings.smartattack.restoreonload.hint=读取存档后是否继续攻击。
settings.smartattack.restoreonload.opt.auto=自动恢复
settings.smartattack.restoreonload.opt.ask=询问
settings.smartattack.restoreonload.opt.off=不恢复
settings.standingorders.enabled=常设命令中的设置
settings.standingorders.enabled.hint=将模组设置加入游戏的常设命令窗口。
settings.ui.language=模组语言
settings.ui.language.hint=模组文本的语言。自动跟随游戏。立即生效。
settings.ui.language.opt.auto=自动
settings.ui.language.opt.cn=中文
settings.ui.density=模组窗口密度
settings.ui.density.hint=紧凑节省屏幕空间；普通使用更大的行高和边距。
settings.ui.density.opt.compact=紧凑
settings.ui.density.opt.normal=普通
settings.ui.unitactiontext=命令栏中的模组动作
settings.ui.unitactiontext.hint=模组控制所选单位时，其“命令：”栏显示的内容。“附带游戏文本”——先显示模组标签，若游戏文本不只是移动或等待，则在句点后附上；“仅模组”——只显示模组标签；“关闭”——只显示游戏文本。
settings.ui.unitactiontext.opt.smart=必要时附带游戏文本
settings.ui.unitactiontext.opt.replace=仅模组
settings.ui.unitactiontext.opt.off=关闭
settings.ui.scale=模组窗口缩放
settings.ui.scale.hint=自动——按游戏界面缩放和屏幕高度；否则为 0.85 到 2 的系数。窗口不会小于 0.85。
settings.ui.toolbarbuttons=游戏面板上的反潜 / CAP 按钮
settings.ui.toolbarbuttons.hint=游戏底部面板右侧的两个按钮用于打开反潜和 CAP 窗口。关闭——移除按钮；地图菜单项和热键保留。
settings.settings.hotkey=打开设置窗口
settings.settings.hotkey.hint=打开模组设置窗口的按键（仅限任务中）。
