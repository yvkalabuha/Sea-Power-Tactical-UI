; ---------------------------------------------------------------- T-138: intercept course
settings.intercept.enabled=拦截航向
settings.intercept.enabled.hint=接触右键菜单中的“拦截航向”项：根据航迹计算拦截点和时间。重启游戏后生效。
settings.intercept.mode=航线跟随目标
settings.intercept.mode.hint=跟踪：目标移动时重新规划航线。一次：只规划一次，不再重新规划。
settings.intercept.mode.opt.track=跟随目标
settings.intercept.mode.opt.once=单次规划
settings.intercept.speed=拦截航速
settings.intercept.speed.hint=自动：能追上目标的最小车钟档位。当前：保持车钟不变。
settings.intercept.speed.opt.auto=自动
settings.intercept.speed.opt.current=保持当前
settings.intercept.showline=地图上的拦截线
settings.intercept.showline.hint=在战术地图上绘制通往拦截点的线和拦截点本身。
settings.intercept.avoidenemyranges=敌方武器区
settings.intercept.avoidenemyranges.hint=根据已识别敌对舰船的武器射程检查航线（按舰级数据，同射程圈；未识别的不计入）。警告：只在菜单和线上显示 ⚠。绕行：有路时航线绕开射程圈，否则警告。关闭：不检查。
settings.intercept.avoidenemyranges.opt.warn=警告
settings.intercept.avoidenemyranges.opt.detour=绕行
settings.intercept.avoidenemyranges.opt.off=关闭
settings.intercept.onzoneentry=进入区域前
settings.intercept.onzoneentry.hint=距进入敌方武器区（非目标的）还有 ZoneLeadS 秒时如何处理。停止并等待：全停，区域离开航线后继续拦截。停止并取消：全停，拦截结束。
settings.intercept.onzoneentry.opt.warn=仅警告
settings.intercept.onzoneentry.opt.hold=停止并等待
settings.intercept.onzoneentry.opt.abort=停止并取消

; ---------------------------------------------------------------- T-137: range rings
settings.rangerings.enabled=射程圈
settings.rangerings.enabled.hint=战术地图上所选武器的射程圈和声呐区。重启游戏后生效。
settings.rangerings.show=显示射程圈
settings.rangerings.show.hint=地图图层项“射程圈”；与热键相同。显示或隐藏全部射程圈。武器在“XO > 射程圈 > 武器”和外方接触菜单“武器 >”中勾选。
settings.rangerings.hotkey=切换射程圈
settings.rangerings.hotkey.hint=开关射程圈的按键。
settings.rangerings.own=己方射程圈
settings.rangerings.own.hint=己方和盟友单位的射程圈。自动：安装 Better TacMap 模组时关闭（由它绘制）。开启：始终绘制，关闭：从不绘制。
settings.rangerings.own.opt.auto=自动（有 Better TacMap 时关闭）
settings.rangerings.own.opt.on=开启
settings.rangerings.own.opt.off=关闭
settings.rangerings.own.btm=己方射程圈由 Better TacMap 绘制（RangeRings.Own=on 可同时绘制本模组的）
settings.rangerings.own.note_off=己方射程圈已关闭（RangeRings.Own=off）
settings.rangerings.own.enemy_only=仅敌方射程圈：己方射程圈已关闭（RangeRings.Own）
settings.rangerings.scope=射程圈对象
settings.rangerings.scope.hint=显示谁的声呐圈：所选己方单位或其整个编组（编队）。
settings.rangerings.scope.opt.selected=所选单位
settings.rangerings.scope.opt.group=整个编组
settings.rangerings.show.sonar=声呐圈
settings.rangerings.show.sonar.hint=所选己方单位的主动和被动声呐范围，以及所选或固定的外方接触的被动声呐。默认关闭。
settings.rangerings.showallies=盟友单位
settings.rangerings.showallies.hint=同时绘制所选编组中盟友单位的声呐圈。
settings.rangerings.labels=射程圈标签
settings.rangerings.labels.hint=在射程圈旁显示武器及其射程：“Harpoon 67 海里”，外方舰级为“Harpoon 最远 67 海里”。
settings.rangerings.legend=射程圈图例
settings.rangerings.legend.hint=地图右上角、时间面板下方、雷达图例上方的射程圈颜色说明。关闭——地图菜单项不可用。

; ---------------------------------------------------------------- T-100: aircraft evasion
settings.airevade.enabled=飞机规避攻击
settings.airevade.enabled.hint=飞机命令环中的“规避攻击”项和“自动导弹规避”标志。重启游戏后生效。
settings.airevade.autottis=自动规避：命中前秒数
settings.airevade.autottis.hint=“自动导弹规避”标志：距命中剩余时间不超过此值时，飞机转向避开导弹。
settings.airevade.optionhint=游戏选项关闭时提示
settings.airevade.optionhint.hint=每个任务提示一次：游戏的飞机导弹规避选项已关闭。
settings.perf.lightsmoke=导弹与爆炸轻量烟雾
settings.perf.lightsmoke.hint=新的导弹尾迹、爆炸、火焰和水花使用更少粒子。降低战斗中的 GPU 负载；测量中 FPS 未见提升。默认关闭。
settings.messages.hostilered=敌对接触显示为红色
