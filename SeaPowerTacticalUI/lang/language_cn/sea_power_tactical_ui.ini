; ---- doctrine ----
[TacticalDoctrine]
VB_AutoEvade=自动规避鱼雷
VB_VetoNeutral=中立目标附近禁止开火
VB_AirDefenseReady=防空准备
VB_PostLaunchBreak=发射后脱离
VB_PostLaunchRetarget=发射后转向下一目标
VB_AutoEvadeAir=自动规避导弹
[Tooltip]
VB_AutoEvade=舰艇或潜艇自行规避探测到的鱼雷。
VB_VetoNeutral=目标附近有中立或民用目标时不开火。
VB_AirDefenseReady=一次性开启辐射和对空雷达，并将交战规则至少提升为确认开火；关闭时恢复未被改动的设置。
VB_PostLaunchBreak=发射导弹后，飞机脱离目标。
VB_PostLaunchRetarget=脱离后，飞机选择下一个目标（需开启发射后脱离）。
VB_AutoEvadeAir=飞机比游戏更早规避导弹（命中前约 20 秒）。

