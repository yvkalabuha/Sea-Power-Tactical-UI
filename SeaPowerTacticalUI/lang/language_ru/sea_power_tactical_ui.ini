VB_PostLaunchBreak=После пуска ракеты самолёт отворачивает от цели.
VB_PostLaunchRetarget=После отворота самолёт сам берёт следующую цель (нужен отворот).
VB_AutoEvadeAir=Самолёт уклоняется от ракеты раньше игры (за ~20 с до попадания).

