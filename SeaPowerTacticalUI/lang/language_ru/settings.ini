settings.intercept.avoidenemyranges.hint=Маршрут проверяется по дальности оружия опознанных враждебных кораблей (по данным класса, как круги дальности; неопознанные не видны). Предупреждать: только ⚠ в меню и на линии. Обходить: маршрут обходит круги, если путь есть, иначе предупреждение. Выкл.: без проверки.
